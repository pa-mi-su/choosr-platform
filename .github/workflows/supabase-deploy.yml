name: Supabase Deployment

on:
  push:
    branches: [dev, uat, main]
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosr-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev) environment=dev ;;
            refs/heads/uat) environment=uat ;;
            refs/heads/main) environment=prod ;;
            *)
              echo "Unsupported deployment ref: ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Supabase ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - name: Deployment safety gate
        id: gate
        env:
          ENABLED: ${{ vars.SUPABASE_DEPLOY_ENABLED }}
        run: |
          if [ "${ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment is disabled for this environment."
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'
      - name: Validate required credentials
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment value: ${name}"
              exit 1
            fi
          done
      - name: Link project
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview database deployment
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --dry-run
      - name: Apply database migrations
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked
      - name: Deploy Edge Functions
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_BASE64:-}" ]; then
            echo "::error::Missing required environment secret: FIREBASE_SERVICE_ACCOUNT_BASE64"
            exit 1
          fi
          npx supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            FIREBASE_SERVICE_ACCOUNT_BASE64="$FIREBASE_SERVICE_ACCOUNT_BASE64"

          if [ -n "${GEOAPIFY_API_KEY:-}" ]; then
            npx supabase secrets set \
              --project-ref "$SUPABASE_PROJECT_REF" \
              GEOAPIFY_API_KEY="$GEOAPIFY_API_KEY"
            npx supabase functions deploy build-deck --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "::error::GEOAPIFY_API_KEY is required for Activity and Food decks."
            exit 1
          fi

          npx supabase functions deploy dispatch-notifications --project-ref "$SUPABASE_PROJECT_REF"
