name: Choosr CI

on:
  pull_request:
    branches: [dev, uat, prod, main]
  push:
    # Feature/integration work is validated once through pull requests. Push
    # validation remains on promoted environment branches after merge.
    branches: [uat, prod, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected platforms
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              echo "android=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="${before}...HEAD"
          fi

          changed_files="$(git diff --name-only "$range")"
          if grep -Eq '^(android/|src/|App\.tsx$|index\.js$|package(-lock)?\.json$|react-native\.config\.js$|babel\.config\.js$|scripts/generate-env\.mjs$)' <<< "$changed_files"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  application:
    name: TypeScript and application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets:verify
      - run: npm run env:verify
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand

  database:
    name: Supabase migration and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npm run supabase:start
      - name: Rebuild schema from migrations
        run: npm run supabase:reset
      - name: Run database assertions
        run: npm run supabase:test
      - name: Lint database schema
        run: npm run supabase:lint
      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop

  android:
    name: Android production-debug build
    needs: changes
    # Pull requests validate native compilation. Promoted environment pushes
    # are handled by mobile-build.yml, which creates the signed artifact. Do
    # not compile the same React Native application twice after a merge.
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run env:generate:test
      - name: Materialize CI-only Firebase placeholders
        run: node scripts/materialize-ci-firebase-configs.mjs
      - name: Build production debug variant
        working-directory: android
        run: ./gradlew assembleProdDebug -PreactNativeArchitectures=x86_64 --build-cache --parallel --no-daemon --console=plain
