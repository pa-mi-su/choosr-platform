name: Choosr iOS CI

on:
  pull_request:
    branches: [dev, uat, prod, main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: choosr-ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: Production simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run env:generate:test
      - name: Materialize CI-only Firebase placeholders
        run: node scripts/materialize-ci-firebase-configs.mjs
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
      - name: Build without signing
        working-directory: ios
        run: >-
          xcodebuild
          -workspace Choosr.xcworkspace
          -scheme Choosr-Prod
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
